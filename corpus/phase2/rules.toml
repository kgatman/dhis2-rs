# diffcheck rules for the phase-2 corpus. Every rule states why the difference is irrelevant.

compare_headers = [
  "content-type",
  "content-disposition",
  "location",
  "cache-control",
  "content-security-policy",
  "x-content-type-options",
  "x-xss-protection",
  "x-frame-options",
]

[[replace]]
regex = "[a-zA-Z][a-zA-Z0-9]{10}"
with = "<uid>"
paths = ["/api/system/uid", "/api/system/id", "/api/41/system/uid", "/api/41/system/id"]
reason = "CodeGenerator UIDs are random per call; count, shape and position must still match."

[[replace]]
regex = "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
with = "<uuid>"
paths = ["/api/system/uuid"]
reason = "Random v4 UUIDs differ per call; count and format must still match."

[[ignore_key]]
key = "serverDate"
paths = ["/api/system/info"]
reason = "new Date() at request time; the Java and Rust requests run at different instants."

[[ignore_key]]
key = "time"
paths = ["/api/system/info"]
reason = "databaseInfo.time is the DB's now() at request time; differs between the two requests."

[[ignore_key]]
key = "intervalSinceLastAnalyticsTableSuccess"
paths = ["/api/system/info"]
reason = "Derived from the request time (seconds resolution); can tick between the two requests."

[[ignore_key]]
key = "intervalSinceLastAnalyticsTablePartitionSuccess"
paths = ["/api/system/info"]
reason = "Derived from the request time (seconds resolution); can tick between the two requests."

[[ignore_key]]
key = "lastUpdated"
paths = ["/api/me"]
reason = "Java stamps the user's lastUpdated on every basic-auth login (measured: consecutive basic-auth requests differ, requests on one session do not), so the Java and gateway requests see different values."

# Registered schemas (ADR 0007): Java reorders these on every JVM start (measured across a
# restart: same content, different order), so no client can depend on the order. Rust serves the
# order of the captured run.
[[unordered]]
key = "schemas"
paths = ["/api/schemas"]
reason = "getSortedSchemas sorts by `order` only; ties keep ConcurrentHashMap<Class> order (identity hashes), different on each JVM start."

[[unordered]]
key = "references"
paths = ["/api/schemas"]
reason = "Schema#getReferences is a HashSet<Class> (identity hashes): its order changes on each JVM start."

[[unordered]]
key = "properties"
paths = ["/api/schemas"]
reason = "Schema#getProperties lists a HashMap whose same-bucket entries follow reflection order, which changes between JVM starts."

[[unordered]]
key = "legends"
paths = ["/api/legendSets"]
reason = "LegendSet#legends is a Set of entities with identity hash codes: Java returns them in a different order on each request (measured: two consecutive Java responses differ)."

[[unordered]]
key = "categories"
paths = ["/api/categoryOptions"]
reason = "A Set of entities (Hibernate PersistentSet): Java writes it in no defined order (measured: dataElementGroups/dataElements differ between consecutive requests)."

[[unordered]]
key = "categoryCombos"
paths = ["/api/categories"]
reason = "A Set of entities (Hibernate PersistentSet): Java writes it in no defined order (measured: dataElementGroups/dataElements differ between consecutive requests)."

[[unordered]]
