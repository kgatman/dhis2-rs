# Gateway route table. Anything not matched here goes to the Java server.
#
# Rules are tried in order; the first match wins. Paths are matched after Java's own
# normalisation (/api/{28..44}/ prefix, one trailing slash, registered extensions such as
# .json/.xml/.csv), so "/api/schemas" also covers "/api/41/schemas.json".
#
# Pattern segments: literal, "*" or "{name}" (one segment), trailing "**" (any rest).
#
# Flip an endpoint only after its diffcheck corpus passes and e2e is green, then update
# docs/inventory/endpoints.csv (status java -> rust-shadow -> rust). Roll back by deleting the
# rule and sending SIGHUP to the gateway (or restarting it).
#
# Example:
# [[route]]
# methods = ["GET"]
# path = "/api/schemas/**"
# backend = "rust"
# note = "SchemaController (phase 2)"

# --- Phase 2 ---------------------------------------------------------------------------------

# SystemController#getUid/getUidCsv/getUuid. diffcheck corpus/phase2/system-uid.jsonl: 84/84,
# shadow: 67 matched, 0 mismatched. XML for /uuid and other Accept values fall back to Java.
[[route]]
methods = ["GET", "HEAD"]
path = "/api/system/uid"
backend = "rust"
note = "SystemController#getUid, getUidCsv"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/system/id"
backend = "rust"
note = "SystemController#getUid, getUidCsv"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/system/uuid"
backend = "rust"
note = "SystemController#getUuid (JSON; XML falls back)"

# SystemController#getSystemInfo. diffcheck corpus/phase2/system-info.jsonl: 48/48 (superuser and
# non-superuser, fields=/presets/exclusions/errors); shadow: 43 matched, 0 mismatched. JVM/build
# values are mirrored from Java (ADR 0005). Field transformers, JSONP/XML and non-PostgreSQL
# analytics fall back to Java.
[[route]]
methods = ["GET", "HEAD"]
path = "/api/system/info"
backend = "rust"
note = "SystemController#getSystemInfo"

# MeController#getAuthorities/hasAuthority/getSettings/getSetting. diffcheck
# corpus/phase2/me.jsonl: 328/328 (superuser and non-superuser with stored settings; Spring's
# reflected-file-download header; firewall rejections); shadow: 197 matched, 0 mismatched. Session
# state (authorities, user settings) comes from the delegated /api/me call. Non-JSON Accept,
# prefix-resolved setting keys and keys needing JSON escaping fall back to Java.
[[route]]
methods = ["GET", "HEAD"]
path = "/api/me/authorities"
backend = "rust"
note = "MeController#getAuthorities"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/me/authorization"
backend = "rust"
note = "MeController#getAuthorities"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/me/authorities/{authority}"
backend = "rust"
note = "MeController#hasAuthority"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/me/authorization/{authority}"
backend = "rust"
note = "MeController#hasAuthority"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/me/settings"
backend = "rust"
note = "MeController#getSettings"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/me/settings/{key}"
backend = "rust"
note = "MeController#getSetting"

# SchemaController#getSchemas/getSchema/getSchemaProperty. Registered schemas captured from the
# pinned build (ADR 0007). diffcheck corpus/phase2/schemas.jsonl: 333/333 against a Java restarted
# after the capture (schema/references/properties order compared as sets, rules.toml); shadow:
# 1216 matched, 0 mismatched. The three move together: Java keeps the last generated links in
# shared objects and getSchemaProperty shows them. XML, field transformers fall back.
[[route]]
methods = ["GET", "HEAD"]
path = "/api/schemas"
backend = "rust"
note = "SchemaController#getSchemas"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/schemas/{type}"
backend = "rust"
note = "SchemaController#getSchema"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/schemas/{type}/{property}"
backend = "rust"
note = "SchemaController#getSchemaProperty"

# ConstantController (AbstractFullReadOnlyController#getObjectList via the GistBridge, and
# AbstractGistReadOnlyController#getObjectListGist), ADR 0008. diffcheck
# corpus/phase2/constants.jsonl: 259/259 (superusers, a non-superuser with user and group
# sharing). Non-superusers need the session's identity (ADR 0009): sessions the gateway did not
# see created and token requests fall back to Java (G8).
[[route]]
methods = ["GET", "HEAD"]
path = "/api/constants"
backend = "rust"
note = "ConstantController#getObjectList (Gist bridge)"

[[route]]
methods = ["GET", "HEAD"]
path = "/api/constants/gist"
backend = "rust"
note = "ConstantController#getObjectListGist"

