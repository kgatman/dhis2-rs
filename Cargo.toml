[workspace]
resolver = "3"
members = ["crates/*", "tools/inventory"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Exact pins (`=`) on purpose: see docs/adr/0001-workspace-layout.md.
[workspace.dependencies]
anyhow = "=1.0.104"
md-5 = "=0.11.0"
base64 = "=0.23.1"
axum = "=0.8.9"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
form_urlencoded = "=1.2.2"
jiff = { version = "=0.2.38", features = ["tzdb-bundle-always"] }
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
quick-xml = "=0.42.0"
rand = "=0.10.3"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
similar = "=3.2.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring-native-roots"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "=1.1.8"
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
uuid = { version = "=1.28.0", features = ["v4"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
tree-sitter = "=0.27.1"
tree-sitter-java = "=0.23.5"
rustix = { version = "=1.1.5", features = ["fs"] }
walkdir = "=2.5.0"
csv = "=1.4.0"

dhis-config = { path = "crates/dhis-config" }
dhis-core-model = { path = "crates/dhis-core-model" }
dhis-db = { path = "crates/dhis-db" }
dhis-schema = { path = "crates/dhis-schema" }
dhis-query = { path = "crates/dhis-query" }
dhis-acl = { path = "crates/dhis-acl" }
dhis-metadata = { path = "crates/dhis-metadata" }
dhis-aggregate = { path = "crates/dhis-aggregate" }
dhis-tracker = { path = "crates/dhis-tracker" }
dhis-analytics = { path = "crates/dhis-analytics" }
dhis-expression = { path = "crates/dhis-expression" }
dhis-jobs = { path = "crates/dhis-jobs" }
dhis-auth = { path = "crates/dhis-auth" }
dhis-files = { path = "crates/dhis-files" }
dhis-reporting = { path = "crates/dhis-reporting" }
dhis-web = { path = "crates/dhis-web" }
diffcheck = { path = "crates/diffcheck" }
