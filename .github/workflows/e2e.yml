name: e2e-through-gateway

# Runs dhis2-core's black-box API suite (dhis-test-e2e) against the Java server *through the
# gateway* with the route table in config/routes.toml. This is the acceptance gate for every
# route flip. With `baseline: true` it also runs the suite directly against Java, to tell
# upstream flakiness apart from gateway-induced failures.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Also run the suite directly against Java (no gateway)"
        type: boolean
        default: false
      test_args:
        description: "Extra Maven args for dhis-test-e2e, e.g. -Dtest=MeActionsTest"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx1024m -Xms1024m -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3
  DHIS2_IMAGE: dhis2/core-dev:local
  GATEWAY_IMAGE: dhis2-rust/gateway:local
  SELENIUM_IMAGE: selenium/standalone-chrome:latest
  DHIS2_E2E_TEST_ARGS: ${{ inputs.test_args }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.baseline && '["gateway","direct"]' || '["gateway"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned dhis2-core ref
        id: core
        run: echo "sha=$(cat ci/dhis2-core.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: dhis2/dhis2-core
          ref: ${{ steps.core.outputs.sha }}
          path: dhis2-core
          fetch-depth: 1

      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # Same build as dhis2-core's run-api-tests.yml, at the pinned commit.
      - name: Build Java server image
        run: |
          mvn clean verify --threads 2C --batch-mode --no-transfer-progress \
            -DskipTests -Dpackaging.type=jar -Dmdep.analyze.skip --update-snapshots \
            --file dhis2-core/dhis-2/pom.xml \
            --projects dhis-web-server --also-make --activate-profiles embedded,jibDockerBuild \
            -Djib.to.image=$DHIS2_IMAGE

      - name: Build gateway image
        if: matrix.mode == 'gateway'
        run: docker build -f Dockerfile.gateway -t $GATEWAY_IMAGE .

      - name: Run e2e through gateway
        if: matrix.mode == 'gateway'
        env:
          DHIS2_CORE_DIR: ${{ github.workspace }}/dhis2-core
          SKIP_GATEWAY_BUILD: "1"
        run: ci/e2e/run.sh

      - name: Run e2e directly against Java (baseline)
        if: matrix.mode == 'direct'
        working-directory: dhis2-core/dhis-2/dhis-test-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --remove-orphans --exit-code-from test
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color web > ${{ github.workspace }}/web.log || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.mode }}-logs
          path: |
            target/e2e/
            web.log
          if-no-files-found: ignore
